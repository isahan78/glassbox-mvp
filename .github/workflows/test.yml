name: Tests

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ['3.10', '3.11']

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .

      - name: Run tests
        run: |
          pytest tests/ -v --tb=short

      - name: Test import
        run: |
          python -c "from glassbox import ActivationTracer; print('✅ Import successful')"

  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install linting tools
        run: |
          pip install black mypy flake8

      - name: Check code formatting with black
        run: |
          black --check glassbox/ api/ dashboard/ tests/

      - name: Run flake8
        run: |
          flake8 glassbox/ api/ dashboard/ tests/ --max-line-length=120 --ignore=E203,E501,W503

      - name: Run mypy type checking
        run: |
          mypy glassbox/ --ignore-missing-imports
        continue-on-error: true  # Don't fail on type errors for now

  security:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install safety
        run: |
          pip install safety

      - name: Check for security vulnerabilities
        run: |
          pip install -r requirements.txt
          safety check --ignore 70612
        continue-on-error: true  # Don't fail build on vulnerabilities for now
